name: release

on:
  release: # Docs: <https://help.github.com/en/articles/events-that-trigger-workflows#release-event-release>
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            archiver: tar
          - os: linux
            arch: arm64
            archiver: tar
          - os: darwin
            arch: amd64
            archiver: zip
          - os: darwin
            arch: arm64
            archiver: tar
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Generate builder values
        id: values
        run: |
          echo "version=$(echo ${GITHUB_REF##*/} | sed -e 's/^[vV ]*//')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%FT%T%z)" >> $GITHUB_OUTPUT

      - name: Compile binary file
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          LDFLAGS: >-
            -s
            -X github.com/roadrunner-server/velox/v3/internal/version.version=${{ steps.values.outputs.version }}
            -X github.com/roadrunner-server/velox/v3/internal/version.buildTime=${{ steps.values.outputs.timestamp }}
        run: |
          go build -trimpath -ldflags "$LDFLAGS" -o ./vx ./cmd/vx
          stat ./vx

      - name: Generate distributive directory name
        id: dist-dir
        run: echo "name=velox-${{ steps.values.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Generate distributive archive name
        id: dist-arch
        run: |
          case "${{ matrix.archiver }}" in
            zip) ext='zip';;
            tar) ext='tar.gz';;
            *)   exit 10;;
          esac
          echo "name=${{ steps.dist-dir.outputs.name }}.${ext}" >> $GITHUB_OUTPUT

      - name: Create distributive
        run: |
          mkdir ${{ steps.dist-dir.outputs.name }}
          mv ./vx ./${{ steps.dist-dir.outputs.name }}/
          cp ./README.md ./LICENSE ./velox.toml ./${{ steps.dist-dir.outputs.name }}/

      - name: Pack distributive using tar
        if: matrix.archiver == 'tar'
        run: tar -zcf "${{ steps.dist-arch.outputs.name }}" "${{ steps.dist-dir.outputs.name }}"

      - name: Pack distributive using zip
        if: matrix.archiver == 'zip'
        run: zip -r -q "${{ steps.dist-arch.outputs.name }}" "${{ steps.dist-dir.outputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dist-dir.outputs.name }}
          path: ${{ steps.dist-arch.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.dist-arch.outputs.name }}
          asset_name: ${{ steps.dist-arch.outputs.name }}
          tag: ${{ github.ref }}

  docker:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4 # Action page: <https://github.com/docker/setup-qemu-action>

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # Action page: <https://github.com/docker/setup-buildx-action>

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_LOGIN }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Generate builder values
        id: values
        run: |
          echo "version=$(echo ${GITHUB_REF##*/} | sed -e 's/^[vV ]*//')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%FT%T%z)" >> $GITHUB_OUTPUT

      - name: Compose image tags
        id: tags
        env:
          VERSION: ${{ steps.values.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          {
            echo "list<<EOF"
            echo "spiralscout/velox:${VERSION}"
            echo "ghcr.io/roadrunner-server/velox:${VERSION}"
            # a prerelease must not move the :latest tag
            if [ "${PRERELEASE}" = "false" ]; then
              echo "spiralscout/velox:latest"
              echo "ghcr.io/roadrunner-server/velox:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v7 # Action page: <https://github.com/docker/build-push-action>
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.values.outputs.version }}
            BUILD_TIME=${{ steps.values.outputs.timestamp }}
          tags: ${{ steps.tags.outputs.list }}
